name: Build
on:
push:
branches: [ main, master ]
workflow_dispatch:
jobs:
build-windows:
runs-on: windows-latest
steps:
- uses: actions/checkout@v4
- run: cmake -B build
- run: cmake --build build --config Release --parallel
- uses: actions/upload-artifact@v4
with:
name: SnapCompressRR-VST3-Windows
path: build/SnapCompressRR_artefacts/Release/VST3/
